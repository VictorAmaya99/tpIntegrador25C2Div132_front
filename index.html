<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, 
        initial-scale=1.0">
        <title>Tiendita</title>

        <link rel="stylesheet" href="css/styles.css">

        <!-- <script defer src="js/main.js"></script>         -->
    </head>

    <body class="pagina-principal">

        <header>
            <div>
                <h1 class="header-logo"><span class="resaltado">Mi</span>Tiendita</h1>
            </div>                   
                   
        </header>

        <main>
            <section class="heroe">
                <h2>Bienvenido a nuestra tiendita</h2>
                <p>Los mejores productos al mejor precio</p>
                
                <h4>Introducí tu nombre</h4>
                <form id="form-bienvenida">
                    <input type="text" id="bienvenida-nombre">
                    <input class="btn-enviar" type="submit" value="Enviar">
                </form>
            </section>

        </main>

        <footer>
            <p>© 2025 MiTiendita</p>
        </footer>   

        <script>
            // Funcionalidad de la página de bienvenida
            let formBienvenida = document.getElementById("form-bienvenida");

            formBienvenida.addEventListener("submit", event => {
                event.preventDefault()

                let nombreUsuario = document.getElementById("bienvenida-nombre").value;

                if(nombreUsuario.length > 0) {
                    sessionStorage.setItem("nombreUsuario", nombreUsuario);
                    window.location.href = "productos.html";
                }
            });
        </script>
        
    </body>
</html>
